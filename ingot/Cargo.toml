[package]
name = "ingot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ingot"
path = "src/main.rs"

[dependencies]
copper-api.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"

# libvirt is the Linux backend. macOS uses Tart (see src/tart.rs) and must not
# link libvirt, which Homebrew does not ship with a usable KVM-like driver.
[target.'cfg(not(target_os = "macos"))'.dependencies]
virt = "0.4.3"

[features]
# Type-check the macOS backend on Linux: `cargo check --features tart`.
tart = []

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["test-util"] }

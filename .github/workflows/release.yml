name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: package
        run: |
          mkdir -p out
          cp target/release/kiln target/release/ingot target/release/cu out/
          tar -czf copper-${{ matrix.arch }}-linux.tar.gz -C out kiln ingot cu
      - uses: actions/upload-artifact@v4
        with:
          name: copper-${{ matrix.arch }}-linux
          path: copper-${{ matrix.arch }}-linux.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: copper-*-linux.tar.gz
          generate_release_notes: true
